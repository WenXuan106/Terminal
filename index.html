<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Termux Web</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" crossorigin="anonymous">
<style>
  :root { --keybar: #1b1b1b; --key: #2c2c2c; --key-on: #5c9dff; --fg: #e6e6e6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--fg); }
  body { display: flex; flex-direction: column; font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; padding-top: env(safe-area-inset-top, 0px); }
  #term { flex: 1; min-height: 0; padding: 6px 8px; }
  #status { position: fixed; inset: 0 0 auto 0; padding: 6px 10px; font-size: 13px; color: #e5c07b; background: #000; pointer-events: none; z-index: 5; }
  #status[hidden] { display: none; }
  #keys { background: var(--keybar); display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
  #keys button { background: var(--key); color: var(--fg); border: 0; border-radius: 4px; font: 14px ui-monospace, monospace; padding: 11px 0; touch-action: manipulation; }
  #keys button:active, #keys button.on { background: var(--key-on); color: #000; }
  #keys button:focus-visible { outline: 2px solid var(--key-on); outline-offset: 1px; }
  @media (min-width: 800px) { #keys { display: none; } #term { padding: 12px 16px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="status" role="status">Starting Linux&hellip; the first load downloads the CheerpX runtime.</div>
<div id="term"></div>
<div id="keys">
  <button data-s="&#27;">ESC</button><button data-s="/">/</button><button data-s="-">&minus;</button>
  <button data-s="&#27;[H">HOME</button><button data-s="&#27;[A">&uarr;</button><button data-s="&#27;[F">END</button><button data-s="&#27;[5~">PGUP</button>
  <button data-s="&#9;">TAB</button><button data-m="ctrl">CTRL</button><button data-m="alt">ALT</button>
  <button data-s="&#27;[D">&larr;</button><button data-s="&#27;[B">&darr;</button><button data-s="&#27;[C">&rarr;</button><button data-s="&#27;[6~">PGDN</button>
</div>

<script type="module">
const status = document.getElementById("status");
const say = t => { status.style.color = ""; status.textContent = t; status.hidden = !t; };
const fail = m => { status.hidden = false; status.style.color = "#ff6b6b"; status.textContent = m; };
addEventListener("error", e => fail("Error: " + e.message));
addEventListener("unhandledrejection", e => fail("Error: " + ((e.reason && e.reason.message) || e.reason)));
if (typeof Terminal === "undefined" || typeof FitAddon === "undefined") {
  fail("xterm.js failed to load from cdn.jsdelivr.net (blocked or offline). Try another network or disable ad blockers.");
  throw new Error("xterm missing");
}
say("crossOriginIsolated = " + crossOriginIsolated + " \u2014 loading CheerpX runtime\u2026");

// ---- terminal (xterm.js) with a Termux-like palette ----
const term = new Terminal({
  cursorBlink: true, fontSize: 15, convertEol: true,
  fontFamily: 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace',
  theme: { background: "#000000", foreground: "#e6e6e6", cursor: "#e6e6e6" },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById("term"));
fit.fit();

try {
  // ---- real x86 Linux (Debian) running in WebAssembly ----
  if (!crossOriginIsolated) throw new Error("Page is not cross-origin isolated: the COOP + COEP headers are missing (deploy worker.js, it adds them).");
  const CheerpX = await import("/cx/1.2.8/cx.esm.js");
  say("Connecting to disk image\u2026");
  const cloud = await CheerpX.CloudDevice.create((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/disk/debian_large_20230522_5044875331.ext2");
  const idb = await CheerpX.IDBDevice.create("termux-web-disk"); // persists your changes in this browser
  if (location.hash === "#reset") { await idb.reset(); history.replaceState(null, "", location.pathname); }
  const overlay = await CheerpX.OverlayDevice.create(cloud, idb);
  const web = await CheerpX.WebDevice.create("");
  const data = await CheerpX.DataDevice.create();

  say("Booting\u2026");
  const cx = await CheerpX.Linux.create({
    mounts: [
      { type: "ext2", path: "/", dev: overlay },
      { type: "dir", path: "/app", dev: web },
      { type: "dir", path: "/data", dev: data },
      { type: "devs", path: "/dev" },
    ],
  });

  const send = cx.setCustomConsole(buf => term.write(new Uint8Array(buf)), term.cols, term.rows);
  const enc = new TextEncoder();
  let ctrl = false, alt = false;
  const toggle = (name, on) => document.querySelector(`[data-m="${name}"]`).classList.toggle("on", on);
  const feed = str => { for (const b of enc.encode(str)) send(b); };
  const input = str => {
    if (ctrl && str.length === 1) { const c = str.toUpperCase().charCodeAt(0); if (c >= 64 && c <= 95) str = String.fromCharCode(c - 64); ctrl = false; toggle("ctrl", false); }
    if (alt) { str = "\x1b" + str; alt = false; toggle("alt", false); }
    feed(str);
  };

  term.onData(input);
  document.getElementById("keys").addEventListener("pointerdown", e => e.preventDefault()); // keep the soft keyboard open
  document.getElementById("keys").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.m === "ctrl") { ctrl = !ctrl; toggle("ctrl", ctrl); }
    else if (b.dataset.m === "alt") { alt = !alt; toggle("alt", alt); }
    else input(b.dataset.s);
    term.focus();
  });
  addEventListener("click", () => term.focus());

  say("");
  term.focus();
  term.writeln("\x1b[1mWelcome to Termux Web!\x1b[0m");
  term.writeln("Real Debian (x86) running in your browser. Try: \x1b[32mpython3 -V\x1b[0m, \x1b[32mgcc --version\x1b[0m, \x1b[32mls /usr/bin\x1b[0m");
  term.writeln("Changes persist in this browser. Open /#reset to wipe them.\n");

  // Bash without profile files so the Termux-style prompt below is used.
  for (;;) {
    await cx.run("/bin/bash", ["--noprofile", "--norc", "-i"], {
      env: [
        "HOME=/home/user", "USER=user", "SHELL=/bin/bash", "EDITOR=vim",
        "LANG=en_US.UTF-8", "LC_ALL=C", "TERM=xterm-256color",
        "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
        "PS1=\\[\\e[32m\\]\\w\\[\\e[0m\\] $ ",
      ],
      cwd: "/home/user", uid: 1000, gid: 1000,
    });
    term.writeln("\r\n[session ended \u2014 restarting shell]");
  }
} catch (err) {
  console.error(err);
  fail("Could not start Linux: " + (err && err.message || err));
  term.writeln("\x1b[31mCould not start Linux: " + (err && err.message || err) + "\x1b[0m");
  term.writeln("Make sure worker.js is deployed: it proxies CheerpX and the disk image and adds the COOP/COEP headers.");
}
</script>
</body>
</html>
