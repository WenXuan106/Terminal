<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Termux Web</title>
<style>
  :root {
    --bg: #000000;
    --fg: #e6e6e6;
    --dim: #8a8a8a;
    --green: #4ec9b0;
    --blue: #5c9dff;
    --red: #ff6b6b;
    --yellow: #e5c07b;
    --keybar: #1b1b1b;
    --key: #2c2c2c;
    --key-on: #5c9dff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    display: flex; flex-direction: column;
    font: 15px/1.35 ui-monospace, "DejaVu Sans Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #screen { flex: 1; overflow-y: auto; padding: 8px 10px; -webkit-overflow-scrolling: touch; cursor: text; }
  #out { white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; align-items: baseline; }
  .ps1 { white-space: pre; flex: none; }
  #in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--fg); font: inherit; caret-color: var(--fg); padding: 0;
  }
  .g { color: var(--green); } .b { color: var(--blue); } .r { color: var(--red); }
  .y { color: var(--yellow); } .d { color: var(--dim); }
  a { color: var(--blue); }
  #keys {
    background: var(--keybar); display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  #keys button {
    background: var(--key); color: var(--fg); border: 0; border-radius: 4px;
    font: 14px ui-monospace, monospace; padding: 11px 0; touch-action: manipulation;
  }
  #keys button:active, #keys button.on { background: var(--key-on); color: #000; }
  #keys button:focus-visible { outline: 2px solid var(--key-on); outline-offset: 1px; }
  @media (min-width: 800px) { #keys { display: none; } body { font-size: 16px; } #screen { padding: 14px 18px; } }
</style>
</head>
<body>
<div id="screen" role="log" aria-live="polite">
  <div id="out"></div>
  <div class="row"><span class="ps1" id="ps1"></span><input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input" enterkeyhint="send"></div>
</div>
<div id="keys">
  <button data-k="Escape">ESC</button><button data-k="/">/</button><button data-k="-">&minus;</button>
  <button data-k="Home">HOME</button><button data-k="ArrowUp">&uarr;</button><button data-k="End">END</button><button data-k="PageUp">PGUP</button>
  <button data-k="Tab">TAB</button><button data-m="ctrl">CTRL</button><button data-m="alt">ALT</button>
  <button data-k="ArrowLeft">&larr;</button><button data-k="ArrowDown">&darr;</button><button data-k="ArrowRight">&rarr;</button><button data-k="PageDown">PGDN</button>
</div>

<script>
(() => {
  const HOME = "/data/data/com.termux/files/home";
  const PREFIX = "/data/data/com.termux/files/usr";
  const $ = id => document.getElementById(id);
  const out = $("out"), inp = $("in"), screen = $("screen"), ps1 = $("ps1");

  // ---------- virtual filesystem (in memory) ----------
  const dirs = new Set(["/", "/data", "/data/data", "/data/data/com.termux", "/data/data/com.termux/files", PREFIX, PREFIX + "/bin", PREFIX + "/etc", HOME, HOME + "/storage"]);
  const files = new Map([
    [HOME + "/README.md", "# Termux Web\nA browser terminal that looks and feels like Termux.\nNothing here runs real code. Try: help\n"],
    [PREFIX + "/etc/motd", ""],
  ]);
  const installed = new Set(["bash", "coreutils", "pkg"]);
  const history = []; let hIdx = 0, cwd = HOME;

  const parent = p => p.slice(0, p.lastIndexOf("/")) || "/";
  const resolve = p => {
    if (p === "~" || p.startsWith("~/")) p = HOME + p.slice(1);
    if (!p.startsWith("/")) p = cwd + "/" + p;
    const seg = [];
    for (const s of p.split("/")) { if (!s || s === ".") continue; if (s === "..") seg.pop(); else seg.push(s); }
    return "/" + seg.join("/");
  };
  const short = p => p === HOME ? "~" : p.startsWith(HOME + "/") ? "~" + p.slice(HOME.length) : p;
  const children = p => [...dirs, ...files.keys()].filter(x => x !== "/" && parent(x) === p).map(x => x.slice(x.lastIndexOf("/") + 1)).sort();

  // ---------- output helpers ----------
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const link = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  const print = (html = "") => { out.insertAdjacentHTML("beforeend", html + "\n"); screen.scrollTop = screen.scrollHeight; };
  const say = (t, c) => print(c ? `<span class="${c}">${esc(t)}</span>` : esc(t));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const setPs1 = () => { ps1.innerHTML = `<span class="g">${esc(short(cwd))}</span> <span class="d">$</span>&nbsp;`; };

  const welcome = () => print(link(
`Welcome to Termux Web!

Docs:       https://termux.dev/docs
Community:  https://termux.dev/community
Source:     https://github.com/termux/termux-app

Type "help" to see what works in this demo.
Working with packages:
 - Search:  pkg search <query>
 - Install: pkg install <package>
 - Upgrade: pkg upgrade
`));

  // ---------- commands ----------
  const cmds = {
    help() {
      print(`<span class="y">Built-in commands</span>
  help  clear  echo  pwd  cd  ls  cat  mkdir  touch  rm  whoami  date
  uname  history  neofetch  termux-info  termux-setup-storage  pkg / apt
<span class="y">Keys</span>
  Tab complete, Up/Down history, Ctrl+C cancel, Ctrl+L clear`);
    },
    clear() { out.innerHTML = ""; },
    echo(a) { say(a.join(" ")); },
    pwd() { say(cwd); },
    whoami() { say("u0_a247"); },
    date() { say(new Date().toString()); },
    uname(a) { say(a.includes("-a") ? "Linux localhost 5.15.0-termux-web #1 SMP PREEMPT aarch64 Android" : "Linux"); },
    history() { history.forEach((h, i) => say(String(i + 1).padStart(4) + "  " + h)); },
    cd(a) {
      const t = resolve(a[0] || "~");
      if (dirs.has(t)) { cwd = t; setPs1(); }
      else say(`bash: cd: ${a[0]}: ${files.has(t) ? "Not a directory" : "No such file or directory"}`, "r");
    },
    ls(a) {
      const t = resolve(a.find(x => !x.startsWith("-")) || ".");
      if (!dirs.has(t)) return files.has(t) ? say(t.split("/").pop()) : say(`ls: cannot access '${a[0]}': No such file or directory`, "r");
      const all = a.some(x => x.includes("a"));
      const list = children(t).filter(n => all || !n.startsWith("."));
      print(list.map(n => dirs.has(t === "/" ? "/" + n : t + "/" + n) ? `<span class="b">${esc(n)}</span>` : esc(n)).join("  "));
    },
    cat(a) {
      if (!a.length) return;
      for (const f of a) {
        const t = resolve(f);
        if (files.has(t)) say(files.get(t).replace(/\n$/, ""));
        else say(`cat: ${f}: ${dirs.has(t) ? "Is a directory" : "No such file or directory"}`, "r");
      }
    },
    mkdir(a) { a.filter(x => !x.startsWith("-")).forEach(f => { const t = resolve(f); if (dirs.has(t) || files.has(t)) say(`mkdir: cannot create directory '${f}': File exists`, "r"); else if (!dirs.has(parent(t))) say(`mkdir: cannot create directory '${f}': No such file or directory`, "r"); else dirs.add(t); }); },
    touch(a) { a.forEach(f => { const t = resolve(f); if (!dirs.has(parent(t))) say(`touch: cannot touch '${f}': No such file or directory`, "r"); else if (!files.has(t) && !dirs.has(t)) files.set(t, ""); }); },
    rm(a) {
      a.filter(x => !x.startsWith("-")).forEach(f => {
        const t = resolve(f), rec = a.some(x => /^-.*r/.test(x));
        if (files.delete(t)) return;
        if (dirs.has(t)) {
          if (!rec) return say(`rm: cannot remove '${f}': Is a directory`, "r");
          [...dirs].filter(d => d === t || d.startsWith(t + "/")).forEach(d => dirs.delete(d));
          [...files.keys()].filter(k => k.startsWith(t + "/")).forEach(k => files.delete(k));
          if (!dirs.has(cwd)) { cwd = HOME; setPs1(); }
        } else say(`rm: cannot remove '${f}': No such file or directory`, "r");
      });
    },
    "termux-setup-storage"() { dirs.add(HOME + "/storage/shared"); dirs.add(HOME + "/storage/downloads"); say("Storage linked (simulated) in ~/storage"); },
    "termux-info"() { print(`<span class="y">Termux Variables:</span>\nTERMUX_VERSION=web\nTERMUX_APP_PACKAGE_MANAGER=apt\nPREFIX=${PREFIX}\nHOME=${HOME}\nARCH=aarch64`); },
    neofetch() {
      print(`<span class="g">       .:::.        </span>u0_a247<span class="d">@</span>localhost
<span class="g">      ::::::        </span>OS: Android (Termux Web)
<span class="g">      ::::::        </span>Kernel: 5.15.0-termux-web
<span class="g">     .::::::.       </span>Shell: bash 5.2
<span class="g">    ::::::::::      </span>Packages: ${installed.size} (pkg)
<span class="g">    ::::::::::      </span>Terminal: ${esc(navigator.userAgent.includes("Mobile") ? "mobile browser" : "browser")}`);
    },
    async pkg(a) {
      const sub = a[0], names = a.slice(1).filter(x => !x.startsWith("-"));
      if (sub === "update" || sub === "upgrade" || sub === "up") {
        say("Get:1 https://packages.termux.dev/apt/termux-main stable InRelease [14.0 kB]");
        await sleep(500); say("Fetched 14.0 kB in 1s (10.2 kB/s)");
        say(sub === "update" ? "All packages are up to date." : "Calculating upgrade... 0 upgraded, 0 newly installed.");
      } else if (sub === "install" || sub === "i") {
        if (!names.length) return say("Usage: pkg install <package>", "y");
        for (const n of names) {
          if (installed.has(n)) { say(`${n} is already the newest version.`); continue; }
          say(`Reading package lists... Done`); await sleep(350);
          say(`Unpacking ${n} ...`); await sleep(500);
          say(`Setting up ${n} ...`); await sleep(350);
          installed.add(n); files.set(PREFIX + "/bin/" + n, "");
        }
      } else if (sub === "uninstall" || sub === "remove") {
        names.forEach(n => { if (installed.delete(n)) { files.delete(PREFIX + "/bin/" + n); say(`Removing ${n} ...`); } else say(`Package ${n} is not installed.`, "r"); });
      } else if (sub === "list-installed") {
        [...installed].sort().forEach(n => say(n + "/stable [installed]"));
      } else if (sub === "search") {
        const pool = ["python", "nodejs", "git", "vim", "nano", "openssh", "curl", "wget", "clang", "neofetch"];
        pool.filter(p => !names[0] || p.includes(names[0])).forEach(p => say(p + "/stable"));
      } else say("Usage: pkg install|uninstall|update|upgrade|search|list-installed", "y");
    },
  };
  cmds.apt = cmds.pkg; cmds.ll = a => cmds.ls(["-a", ...a]);

  const run = async line => {
    const parts = line.trim().split(/\s+/); const name = parts[0], args = parts.slice(1);
    if (!name) return;
    if (cmds[name]) return cmds[name](args);
    if (installed.has(name)) return say(`${name}: installed, but real binaries can't run in a browser demo.`, "d");
    say(`bash: ${name}: command not found`, "r");
  };

  // ---------- input handling ----------
  let busy = false, ctrl = false, alt = false;
  const submit = async () => {
    const line = inp.value; inp.value = "";
    print(ps1.innerHTML + esc(line));
    if (line.trim()) { history.push(line); }
    hIdx = history.length;
    busy = true; inp.disabled = true;
    try { await run(line); } catch (e) { say(String(e), "r"); }
    busy = false; inp.disabled = false; inp.focus(); screen.scrollTop = screen.scrollHeight;
  };
  const complete = () => {
    const v = inp.value, parts = v.split(/\s+/), last = parts[parts.length - 1];
    let pool;
    if (parts.length === 1) pool = [...Object.keys(cmds), ...installed];
    else {
      const slash = last.lastIndexOf("/"), base = slash >= 0 ? last.slice(0, slash + 1) : "";
      pool = children(resolve(base || ".")).map(n => base + n);
    }
    const hits = [...new Set(pool)].filter(x => x.startsWith(last));
    if (hits.length === 1) { parts[parts.length - 1] = hits[0] + (dirs.has(resolve(hits[0])) ? "/" : " "); inp.value = parts.join(" "); }
    else if (hits.length > 1) { print(ps1.innerHTML + esc(v)); say(hits.join("  ")); }
  };
  const press = key => {
    if (busy) { if (ctrl && key.toLowerCase() === "c") say("^C", "d"); return; }
    if (ctrl) {
      const k = key.toLowerCase(); ctrl = false; document.querySelector('[data-m="ctrl"]').classList.remove("on");
      if (k === "c") { print(ps1.innerHTML + esc(inp.value) + "^C"); inp.value = ""; }
      else if (k === "l") cmds.clear();
      else if (k === "a") inp.setSelectionRange(0, 0);
      else if (k === "e") inp.setSelectionRange(inp.value.length, inp.value.length);
      else if (k === "u") inp.value = "";
      return;
    }
    const n = inp.value.length, p = inp.selectionStart;
    switch (key) {
      case "Enter": submit(); break;
      case "Tab": complete(); break;
      case "ArrowUp": if (hIdx > 0) inp.value = history[--hIdx]; break;
      case "ArrowDown": inp.value = hIdx < history.length - 1 ? history[++hIdx] : (hIdx = history.length, ""); break;
      case "ArrowLeft": inp.setSelectionRange(Math.max(0, p - 1), Math.max(0, p - 1)); break;
      case "ArrowRight": inp.setSelectionRange(Math.min(n, p + 1), Math.min(n, p + 1)); break;
      case "Home": inp.setSelectionRange(0, 0); break;
      case "End": inp.setSelectionRange(n, n); break;
      case "PageUp": screen.scrollBy(0, -screen.clientHeight * .8); break;
      case "PageDown": screen.scrollBy(0, screen.clientHeight * .8); break;
      case "Escape": inp.value = ""; break;
      default: if (key.length === 1) inp.setRangeText(key, p, inp.selectionEnd, "end");
    }
  };

  inp.addEventListener("keydown", e => {
    if (busy) { if (e.ctrlKey && e.key === "c") say("^C", "d"); return; }
    if (e.ctrlKey && /^[caelu]$/i.test(e.key)) { e.preventDefault(); ctrl = true; press(e.key); return; }
    if (["Enter", "Tab", "ArrowUp", "ArrowDown", "PageUp", "PageDown"].includes(e.key)) { e.preventDefault(); press(e.key); }
  });
  $("keys").addEventListener("pointerdown", e => e.preventDefault()); // keep keyboard open
  $("keys").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.m) {
      if (b.dataset.m === "ctrl") { ctrl = !ctrl; b.classList.toggle("on", ctrl); }
      else { alt = !alt; b.classList.toggle("on", alt); }
      return;
    }
    const k = b.dataset.k;
    if (ctrl && k.length === 1) { press(k); return; }
    press(k); inp.focus();
  });
  screen.addEventListener("click", () => { if (!getSelection().toString()) inp.focus(); });

  welcome(); setPs1(); inp.focus();
})();
</script>
</body>
</html>
